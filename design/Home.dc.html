<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400..800&display=swap">
  <style>
    body { margin: 0; font-family: 'Figtree', ui-sans-serif, system-ui, sans-serif; }
    a { color: #6D4AFF; } a:hover { color: #5539D6; }
    .num { font-variant-numeric: tabular-nums; }
    .display { font-family: 'Bricolage Grotesque', 'Figtree', sans-serif; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #FAF7F2; color: #1F1B16; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 28px 20px 18px 20px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 13px; font-weight: 600; color: #7A7168; letter-spacing: 0.02em;">Boa noite, Marina</span>
      <span class="display" style="font-size: 27px; font-weight: 700; letter-spacing: -0.02em;">Minhas viagens</span>
    </div>
    <div style="width: 40px; height: 40px; border-radius: 999px; background: #6D4AFF; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700;">M</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 4px 20px 0 20px; overflow: hidden;">

    <div style="background: #FFFFFF; border: 1px solid #E8E1D7; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 6px 20px rgba(31, 27, 22, 0.05);">
      <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
        <div style="display: flex; flex-direction: column; gap: 5px;">
          <span class="display" style="font-size: 21px; font-weight: 700; letter-spacing: -0.01em;">Japão</span>
          <span style="font-size: 13px; color: #7A7168; font-weight: 500;">12 – 26 de março · 4 pessoas</span>
        </div>
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #1F8A5B; background: #E3F5EC; padding: 6px 10px; border-radius: 999px;">Em curso</span>
      </div>

      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;">
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <span style="font-size: 12px; font-weight: 600; color: #7A7168;">Você tem a receber</span>
          <span class="display num" style="font-size: 30px; font-weight: 700; color: #1F8A5B; letter-spacing: -0.02em;">R$ 1.284,30</span>
        </div>
        <div style="display: flex; align-items: center;">
          <div style="width: 34px; height: 34px; border-radius: 999px; background: #6D4AFF; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; border: 2px solid #FFFFFF;">V</div>
          <div style="width: 34px; height: 34px; border-radius: 999px; background: #E8654F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; border: 2px solid #FFFFFF; margin-left: -10px;">A</div>
          <div style="width: 34px; height: 34px; border-radius: 999px; background: #E2A63C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; border: 2px solid #FFFFFF; margin-left: -10px;">B</div>
          <div style="width: 34px; height: 34px; border-radius: 999px; background: #3FA97A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; border: 2px solid #FFFFFF; margin-left: -10px;">C</div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 7px;">
        <div style="display: flex; height: 6px; border-radius: 999px; overflow: hidden; background: #F3EEE7;">
          <div style="width: 48.6%; background: #6D4AFF;"></div>
          <div style="width: 25.1%; background: #E8654F;"></div>
          <div style="width: 17%; background: #E2A63C;"></div>
          <div style="width: 9.3%; background: #3FA97A;"></div>
        </div>
        <span style="font-size: 12px; color: #7A7168; font-weight: 500;">R$ 18.402,10 gastos · 24 despesas</span>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E8E1D7; border-radius: 24px; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span class="display" style="font-size: 18px; font-weight: 700;">Chapada Diamantina</span>
        <span style="font-size: 12.5px; color: #7A7168; font-weight: 500;">fev · 6 pessoas</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px; align-items: flex-end;">
        <span style="font-size: 11px; font-weight: 600; color: #7A7168;">Você deve</span>
        <span class="num" style="font-size: 17px; font-weight: 700; color: #D2453B;">R$ 87,00</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 4px 2px 4px;">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A79C90;">Encerradas</span>
      <div style="flex-grow: 1; height: 1px; background: #E8E1D7;"></div>
    </div>

    <div style="background: transparent; border: 1px solid #E8E1D7; border-radius: 20px; padding: 15px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 15.5px; font-weight: 650; color: #4A443C;">Bariloche</span>
        <span style="font-size: 12px; color: #A79C90; font-weight: 500;">jul 2025 · 5 pessoas</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; color: #7A7168;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span style="font-size: 12.5px; font-weight: 600;">Tudo acertado</span>
      </div>
    </div>

  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 30px; display: flex;">
    <div style="flex-grow: 1; background: #1F1B16; color: #FAF7F2; border-radius: 999px; height: 54px; display: flex; align-items: center; justify-content: center; gap: 9px; box-shadow: 0 10px 24px rgba(31, 27, 22, 0.22);">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      <span style="font-size: 15.5px; font-weight: 700;">Nova viagem</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
