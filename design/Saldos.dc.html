<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400..800&display=swap">
  <style>
    body { margin: 0; font-family: 'Figtree', ui-sans-serif, system-ui, sans-serif; }
    a { color: #9B7BFF; } a:hover { color: #B49BFF; }
    .num { font-variant-numeric: tabular-nums; }
    .display { font-family: 'Bricolage Grotesque', 'Figtree', sans-serif; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #16141A; color: #F5F1EC; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="padding: 26px 20px 0 20px; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F5F1EC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      <span class="display" style="font-size: 17px; font-weight: 700;">Japão</span>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F5F1EC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"></line><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line></svg>
    </div>

    <div style="display: flex; background: #201D26; border-radius: 999px; padding: 4px; gap: 4px;">
      <div style="flex-grow: 1; border-radius: 999px; padding: 9px 0; text-align: center; font-size: 14px; font-weight: 600; color: #A49CB0;">Despesas</div>
      <div style="flex-grow: 1; background: #2A2632; border-radius: 999px; padding: 9px 0; text-align: center; font-size: 14px; font-weight: 700;">Saldos</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 18px; padding: 22px 20px 0 20px;">

    <div style="display: flex; gap: 10px;">
      <div style="flex-grow: 1; background: #201D26; border-radius: 20px; padding: 15px 16px; display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 11.5px; font-weight: 600; color: #A49CB0;">Total da viagem</span>
        <span class="num display" style="font-size: 20px; font-weight: 700;">R$ 18.402,10</span>
      </div>
      <div style="flex-grow: 1; background: #201D26; border-radius: 20px; padding: 15px 16px; display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 11.5px; font-weight: 600; color: #A49CB0;">Média por pessoa</span>
        <span class="num display" style="font-size: 20px; font-weight: 700;">R$ 4.600,53</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 2px 6px 2px;">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6F6880;">Deve</span>
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6F6880;">Tem a receber</span>
      </div>

      <div style="background: #201D26; border-radius: 22px; padding: 18px 18px; display: flex; flex-direction: column; gap: 20px;">

        <div style="display: flex; flex-direction: column; gap: 9px;">
          <div style="display: flex; align-items: center; gap: 10px;">
            <div style="width: 28px; height: 28px; border-radius: 999px; background: #E8654F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;">A</div>
            <span style="flex-grow: 1; font-size: 15px; font-weight: 650;">Ana</span>
            <span class="num" style="font-size: 15px; font-weight: 700; color: #38C08A;">+R$ 2.140,50</span>
          </div>
          <div style="position: relative; height: 8px;">
            <div style="position: absolute; left: 0; right: 0; top: 3px; height: 2px; background: #2A2632;"></div>
            <div style="position: absolute; left: 50%; top: 0; width: 50%; height: 8px; background: #38C08A; border-radius: 999px;"></div>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 9px;">
          <div style="display: flex; align-items: center; gap: 10px;">
            <div style="width: 28px; height: 28px; border-radius: 999px; background: #9B7BFF; color: #16141A; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;">V</div>
            <span style="flex-grow: 1; font-size: 15px; font-weight: 800;">Você</span>
            <span class="num" style="font-size: 15px; font-weight: 700; color: #38C08A;">+R$ 1.284,30</span>
          </div>
          <div style="position: relative; height: 8px;">
            <div style="position: absolute; left: 0; right: 0; top: 3px; height: 2px; background: #2A2632;"></div>
            <div style="position: absolute; left: 50%; top: 0; width: 30%; height: 8px; background: #38C08A; border-radius: 999px;"></div>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 9px;">
          <div style="display: flex; align-items: center; gap: 10px;">
            <div style="width: 28px; height: 28px; border-radius: 999px; background: #E2A63C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;">B</div>
            <span style="flex-grow: 1; font-size: 15px; font-weight: 650;">Bruno</span>
            <span class="num" style="font-size: 15px; font-weight: 700; color: #FF7A6E;">−R$ 1.902,40</span>
          </div>
          <div style="position: relative; height: 8px;">
            <div style="position: absolute; left: 0; right: 0; top: 3px; height: 2px; background: #2A2632;"></div>
            <div style="position: absolute; right: 50%; top: 0; width: 44.4%; height: 8px; background: #FF7A6E; border-radius: 999px;"></div>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 9px;">
          <div style="display: flex; align-items: center; gap: 10px;">
            <div style="width: 28px; height: 28px; border-radius: 999px; background: #3FA97A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;">C</div>
            <span style="flex-grow: 1; font-size: 15px; font-weight: 650;">Carla</span>
            <span class="num" style="font-size: 15px; font-weight: 700; color: #FF7A6E;">−R$ 1.522,40</span>
          </div>
          <div style="position: relative; height: 8px;">
            <div style="position: absolute; left: 0; right: 0; top: 3px; height: 2px; background: #2A2632;"></div>
            <div style="position: absolute; right: 50%; top: 0; width: 35.6%; height: 8px; background: #FF7A6E; border-radius: 999px;"></div>
          </div>
        </div>

      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; background: #201D26; border: 1px solid #322D3B; border-radius: 18px; padding: 14px 16px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9B7BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="16" x2="12" y2="11"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
      <span style="font-size: 12.5px; line-height: 1.45; color: #A49CB0; font-weight: 500;">Os saldos somam zero. Nenhuma diferença de arredondamento.</span>
    </div>

  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 30px; display: flex;">
    <div style="flex-grow: 1; background: #9B7BFF; color: #16141A; border-radius: 999px; height: 54px; display: flex; align-items: center; justify-content: center; gap: 9px;">
      <span style="font-size: 16px; font-weight: 700;">Fechar a viagem</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16141A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
